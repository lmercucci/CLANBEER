    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contato | Clan Beer</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">		
    </head>
    <body>

        <header>
            <a href="index.html" class="logo">🍻 Clan Beer</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="cervejas.html">Nossas Cervejas</a>
                <a href="contato.html" class="active">Contato</a>
            </nav>
        </header>

        <main class="contato-container">
            <h1>Fale Conosco</h1>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Como podemos te ajudar?"></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </main>

        <footer>
            <p>© 2026 Cervejaria Clan Beer. Beba com moderação.</p>
        </footer>
        <a href="https://wa.me/11992090275" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
            <span>💬</span>
        </a>
    </body>
    </html>
